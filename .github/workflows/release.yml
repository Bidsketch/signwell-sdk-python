name: Release

# Publishes a tagged release to PyPI using trusted publishing (OIDC).
# No API token is stored: GitHub proves this repository's identity and PyPI
# issues a short-lived credential for the upload.
#
# Release flow:  bump `version` in pyproject.toml, merge, then
#                git tag v0.2.0 && git push origin v0.2.0
# The tag must match pyproject.toml; the job refuses otherwise.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve version and check the tag matches pyproject.toml
        id: version
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "::error::Tag v$TAG does not match pyproject.toml version $VERSION"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing signwell-sdk-python $VERSION"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy signwell_sdk

      - name: Test
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Gate publishing behind an environment so a reviewer can be required later.
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing, no stored token)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          args=(--generate-notes --title "v$VERSION")
          if [[ "$VERSION" == *[-a-zA-Z]* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
